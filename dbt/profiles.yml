fraud_analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: analytics
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: 8123
      user: "{{ env_var('CLICKHOUSE_USER', 'student') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'student') }}"
      secure: false
      threads: 2
